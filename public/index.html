<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NIMT ONLINE v2.0</title>
<style>
:root{--bg:#101319;--panel:#1a2029;--panel2:#232b37;--line:#394556;--text:#f4f7fb;--muted:#9ca9b8;--accent:#f0c64d;--danger:#ee6d76;--good:#65d29d;--card:#f7f1dc;--ink:#252118}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.screen{width:100%;height:100%;overflow:hidden}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 11px;cursor:pointer}.btn:hover{filter:brightness(1.1)}.btn.primary{background:var(--accent);border-color:#d5ad36;color:#18130a;font-weight:900}.btn.danger{border-color:#7a4248;color:#ffd7da}.btn:disabled{opacity:.4;cursor:not-allowed}.input{background:#11161d;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px}.muted{color:var(--muted)}
/* title */
#titleScreen{padding:14px}.title-wrap{max-width:1050px;height:100%;margin:auto;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px}.brand{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:9px}.brand h1{margin:0;font-size:30px;letter-spacing:.08em}.brand small{color:var(--muted)}.namebar{display:flex;gap:8px;align-items:center}.namebar .input{width:260px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;min-height:0}.room{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:8px;min-height:0}.room-head{display:flex;justify-content:space-between;gap:8px}.room h2{margin:0;font-size:21px}.room-status{font-size:13px;color:var(--muted)}.room-info{display:grid;align-content:center;gap:5px}.room-actions{display:flex;gap:7px}.room-actions .btn:first-child{flex:1}.footer-note{font-size:12px;color:var(--muted)}
/* app */
#appScreen{padding:7px}.app{max-width:1500px;margin:auto;height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) minmax(0,.72fr);gap:6px;overflow:hidden}.topbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px;display:flex;justify-content:space-between;align-items:center;gap:7px;min-height:0}.top-left{display:flex;align-items:center;gap:9px;min-width:0}.logo{font-weight:1000;letter-spacing:.05em;white-space:nowrap}.room-label,.mode-label,.conn{font-size:12px;color:var(--muted);white-space:nowrap}.conn.ok{color:var(--good)}.top-actions{display:flex;gap:5px}.top-actions .btn{padding:5px 8px;font-size:11px}
.players{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;min-height:0}.player{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;min-width:0}.player.me{border-color:#8b7440}.player.host .pname:after{content:" ★";color:var(--accent)}.pname{font-size:11px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pmeta{font-size:9px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}.pscore{font-size:14px;font-weight:1000;color:var(--accent)}.offline{opacity:.5}
.play-area{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,.72fr);gap:6px;min-height:0;overflow:hidden}.board,.reveal,.hand-panel,.log-panel,.lobby-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;overflow:hidden}.board{padding:6px;display:grid;grid-template-rows:auto repeat(4,minmax(0,1fr));gap:4px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:7px}.section-head h2{font-size:14px;margin:0}.turn-label{font-size:10px;color:var(--muted)}#rows{display:contents}.row{display:grid;grid-template-columns:22px minmax(0,1fr) 68px;align-items:center;gap:4px;background:#141920;border:1px solid #303947;border-radius:7px;padding:3px;min-height:0;overflow:hidden}.row.choice{outline:3px solid var(--accent);cursor:pointer}.row.choice:hover{background:#26271b}.row-num{text-align:center;font-weight:900;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,68px));gap:4px;align-items:center}.row-meta{text-align:right;color:var(--muted);font-size:9px}.row-meta b{display:block;color:var(--text);font-size:10px}
.card,.slot{width:68px;height:92px;border-radius:9px}.card{position:relative;background:var(--card);color:var(--ink);border:2px solid #d3c9ab;box-shadow:0 3px 9px #0005;user-select:none}.card.b7{border-color:#df5d67}.card.b5{border-color:#da8950}.card.b3{border-color:#d1b249}.card.b2{border-color:#76a06d}.num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px;font-weight:1000}.bulls-top,.bulls-bottom{position:absolute;left:2px;right:2px;text-align:center;font-size:12px;line-height:1;letter-spacing:-2px;white-space:nowrap}.bulls-top{top:5px}.bulls-bottom{bottom:5px}.slot{border:2px dashed #465261;background:#0f141a}.slot:after{content:"空き";display:grid;place-items:center;height:100%;font-size:10px;color:#526070}
.reveal{padding:6px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:4px}.reveal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;align-content:start;overflow:hidden}.reveal-item{border:1px solid #303947;background:#141920;border-radius:7px;padding:3px;display:grid;justify-items:center;gap:2px}.reveal-item .card{width:52px;height:70px}.reveal-item .num{font-size:20px}.reveal-item .bulls-top,.reveal-item .bulls-bottom{font-size:8px}.rname{font-size:8px;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.submitted-wait{font-size:10px;color:var(--muted);display:grid;gap:3px}.submitted-line{display:flex;justify-content:space-between;gap:5px}.submitted-line.done{color:var(--good)}
.lower{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,.72fr);gap:6px;min-height:0}.hand-panel,.log-panel{padding:6px}.hand-panel{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:3px}.hand{display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;min-height:0}.hand .card{cursor:pointer;transition:.12s}.hand .card:hover{transform:translateY(-4px)}.hand .card.selected{outline:4px solid var(--accent);transform:translateY(-7px)}.hand .card.locked{cursor:default;opacity:.55}.hand-actions{border-top:1px solid var(--line);padding-top:4px;display:flex;justify-content:space-between;align-items:center;gap:5px}.selected-text{font-size:10px;color:var(--muted)}.log-panel{display:grid;grid-template-rows:auto minmax(0,1fr)}.log{font-size:9px;line-height:1.35;background:#11161c;border-radius:7px;padding:5px;overflow:hidden}.log-line.take{color:#ffb6bb}.log-line.turn{color:#f5db80}.log-line.finish{color:#8ceab8}
/* lobby */
.lobby-main{grid-row:3/5;display:grid;grid-template-columns:1.1fr .9fr;gap:8px;min-height:0}.lobby-panel{padding:12px}.lobby-panel h2{margin:0 0 10px}.lobby-players{display:grid;gap:6px}.lobby-player{display:flex;justify-content:space-between;gap:7px;border-bottom:1px solid #303947;padding:7px}.settings{display:grid;gap:10px}.mode-choice{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mode-card{border:1px solid var(--line);background:#141920;border-radius:10px;padding:10px;cursor:pointer}.mode-card.active{outline:3px solid var(--accent)}.setting-row{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center}.lobby-buttons{display:flex;gap:7px}.lobby-buttons .btn.primary{flex:1}
/* modal */
.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal-bg.show{display:flex}.modal{width:min(620px,100%);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.modal h2{margin-top:0}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:7px;border-bottom:1px solid var(--line);text-align:left}.rank td:last-child,.rank th:last-child{text-align:right}.modal-actions{display:flex;gap:7px;margin-top:12px}.modal-actions .btn{flex:1}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2a2021;border:1px solid #7d454b;color:#ffd9dc;padding:9px 13px;border-radius:10px;z-index:50;display:none}.toast.show{display:block}
@media(max-width:900px){#appScreen{padding:4px}.app{gap:4px}.players{grid-template-columns:repeat(5,1fr)}.play-area{grid-template-columns:minmax(0,1.75fr) minmax(190px,.65fr);gap:4px}.lower{grid-template-columns:minmax(0,1.7fr) minmax(190px,.65fr);gap:4px}.row{grid-template-columns:18px minmax(0,1fr) 52px}.cards{grid-template-columns:repeat(5,minmax(0,52px));gap:2px}.card,.slot{width:52px;height:70px}.num{font-size:20px}.bulls-top,.bulls-bottom{font-size:8px}.reveal-item .card{width:42px;height:57px}.lobby-main{grid-template-columns:1fr 1fr}}
@media(max-width:600px){#titleScreen{padding:7px}.title-wrap{gap:7px}.brand h1{font-size:21px}.rooms{gap:5px}.room{padding:8px}.room h2{font-size:15px}.room-info,.room-status{font-size:10px}.room-actions .btn{font-size:10px;padding:5px}.namebar .input{width:180px;padding:6px}.app{grid-template-rows:auto auto minmax(0,1fr) minmax(0,.68fr)}.topbar{padding:3px 5px}.logo{font-size:11px}.room-label,.mode-label,.conn{font-size:8px}.top-actions .btn{font-size:8px;padding:3px 5px}.players{gap:2px}.player{padding:2px 3px}.pname{font-size:8px}.pmeta{font-size:6px}.pscore{font-size:10px}.play-area{grid-template-columns:minmax(0,1.8fr) minmax(105px,.58fr);gap:2px}.board,.reveal,.hand-panel,.log-panel{padding:3px;border-radius:6px}.section-head h2{font-size:9px}.turn-label{font-size:6px}.row{grid-template-columns:12px minmax(0,1fr) 34px;gap:1px;padding:1px}.row-num{font-size:8px}.row-meta{font-size:5px}.row-meta b{font-size:6px}.cards{grid-template-columns:repeat(5,minmax(0,34px));gap:1px}.card,.slot{width:34px;height:46px;border-radius:5px;border-width:1px}.num{font-size:14px}.bulls-top,.bulls-bottom{font-size:5px;letter-spacing:-1px}.bulls-top{top:2px}.bulls-bottom{bottom:2px}.slot:after{content:""}.reveal-grid{grid-template-columns:repeat(2,1fr);gap:1px}.reveal-item{padding:1px}.reveal-item .card{width:29px;height:39px}.reveal-item .num{font-size:12px}.reveal-item .bulls-top,.reveal-item .bulls-bottom{font-size:4px}.rname{font-size:5px}.submitted-wait{font-size:6px}.lower{grid-template-columns:minmax(0,1.75fr) minmax(105px,.58fr);gap:2px}.hand{gap:0}.hand .card{margin-left:-5px;flex:0 1 34px}.hand .card:first-child{margin-left:0}.hand-actions{padding-top:2px}.selected-text{font-size:6px}.hand-actions .btn{font-size:7px;padding:3px 5px}.log{font-size:6px;padding:3px}.lobby-main{grid-row:3/5;grid-template-columns:1fr;gap:4px}.lobby-panel{padding:7px}.lobby-main .lobby-panel:first-child{max-height:38vh}.lobby-player{padding:3px;font-size:9px}.settings{gap:5px}.mode-card{padding:5px;font-size:9px}.setting-row{grid-template-columns:1fr 90px;font-size:9px}.setting-row .input{padding:4px}.lobby-buttons .btn{padding:5px;font-size:9px}}
</style>
</head>
<body>
<section id="titleScreen" class="screen">
  <div class="title-wrap">
    <div class="brand"><div><h1>NIMT ONLINE</h1><small>v2.0 / 2〜10人</small></div><small>固定4部屋</small></div>
    <div class="namebar"><span>名前</span><input id="nameInput" class="input" maxlength="18" value="プレイヤー"><button id="refreshRooms" class="btn">更新</button></div>
    <div id="rooms" class="rooms"></div>
    <div class="footer-note">部屋が無人になって30分経過すると自動初期化されます。手動初期化も可能です。</div>
  </div>
</section>

<section id="appScreen" class="screen hidden">
<div class="app">
  <header class="topbar">
    <div class="top-left"><span class="logo">NIMT ONLINE</span><span id="roomLabel" class="room-label"></span><span id="modeLabel" class="mode-label"></span><span id="conn" class="conn">接続中</span></div>
    <div class="top-actions"><button id="leaveBtn" class="btn">退室</button><button id="resetBtn" class="btn danger">部屋初期化</button></div>
  </header>
  <div id="players" class="players"></div>

  <div id="lobbyMain" class="lobby-main hidden">
    <section class="lobby-panel"><h2>参加プレイヤー</h2><div id="lobbyPlayers" class="lobby-players"></div></section>
    <section class="lobby-panel"><h2>ゲーム設定</h2><div class="settings">
      <div class="mode-choice"><div id="modeDecrease" class="mode-card"><b>減点式</b><div class="muted">持ち点から減らす</div></div><div id="modeIncrease" class="mode-card"><b>加点式</b><div class="muted">6枚目で加点</div></div></div>
      <div id="startPointsRow" class="setting-row"><span>最初の持ち点</span><input id="startPoints" class="input" type="number" min="1" max="9999" value="66"></div>
      <div id="goalPointsRow" class="setting-row hidden"><span>ゴール点</span><input id="goalPoints" class="input" type="number" min="1" max="9999" value="66"></div>
      <div class="muted" style="font-size:12px" id="ruleText"></div>
      <div class="lobby-buttons"><button id="startBtn" class="btn primary">ゲーム開始</button></div>
    </div></section>
  </div>

  <div id="gameArea" class="play-area hidden">
    <section class="board"><div class="section-head"><h2>場の4列</h2><span id="turnLabel" class="turn-label"></span></div><div id="rows"></div></section>
    <section class="reveal"><div class="section-head"><h2>今回出されたカード</h2><span id="waitLabel" class="turn-label"></span></div><div id="revealGrid" class="reveal-grid"></div></section>
  </div>

  <div id="lower" class="lower hidden">
    <section class="hand-panel"><div class="section-head"><h2>自分の手札</h2><span id="handStatus" class="turn-label"></span></div><div id="hand" class="hand"></div><div class="hand-actions"><span id="selectedText" class="selected-text">カード未選択</span><button id="playBtn" class="btn primary" disabled>このカードを出す</button></div></section>
    <section class="log-panel"><div class="section-head"><h2>進行ログ</h2></div><div id="log" class="log"></div></section>
  </div>
</div>
</section>

<div id="resultModal" class="modal-bg"><div class="modal"><h2 id="resultTitle"></h2><div id="resultBody"></div><div class="modal-actions"><button id="resultAction" class="btn primary"></button></div></div></div>
<div id="toast" class="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const clientId=localStorage.getItem("nimtoClientId")||crypto.randomUUID();localStorage.setItem("nimtoClientId",clientId);
let roomId=null,ws=null,state=null,selected=null,pingTimer=null,manualClose=false;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function bulls(n){if(n===55)return 7;if(n%11===0)return 5;if(n%10===0)return 3;if(n%5===0)return 2;return 1}
function bullSum(cards){return cards.reduce((s,n)=>s+bulls(n),0)}
function cardHTML(n,extra=""){const b=bulls(n),top=Math.min(3,b),bottom=Math.max(0,b-3),cls=b===7?"b7":b===5?"b5":b===3?"b3":b===2?"b2":"";return `<div class="card ${cls} ${extra}" data-card="${n}"><div class="bulls-top">${"🐂".repeat(top)}</div><div class="num">${n}</div><div class="bulls-bottom">${"🐂".repeat(bottom)}</div></div>`}
function toast(msg){const e=$("#toast");e.textContent=msg;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function phaseText(p){return p==="lobby"?"ロビー":p==="playing"?"対戦中":p==="roundEnd"?"ラウンド終了":"終了"}
async function loadRooms(){try{const r=await fetch("/api/rooms",{cache:"no-store"});const d=await r.json();$("#rooms").innerHTML=d.rooms.map((x,i)=>{const id=String(i+1);return `<div class="room"><div class="room-head"><h2>ROOM ${id}</h2><span class="room-status">${phaseText(x.phase)}</span></div><div class="room-info"><b>${x.players}/${x.maxPlayers}人</b><span class="muted">${esc(x.modeText)}</span>${x.phase!=="lobby"?`<span class="muted">ラウンド${x.round} / ${x.turn}ターン</span>`:""}</div><div class="room-actions"><button class="btn primary join" data-room="${id}" ${x.players>=x.maxPlayers&&!x.connected?"disabled":""}>入室</button><button class="btn danger room-reset" data-room="${id}">初期化</button></div></div>`}).join("");document.querySelectorAll(".join").forEach(b=>b.onclick=()=>joinRoom(b.dataset.room));document.querySelectorAll(".room-reset").forEach(b=>b.onclick=()=>resetRoom(b.dataset.room));}catch(e){toast("部屋情報を取得できませんでした")}}
async function resetRoom(id){if(!confirm(`ROOM ${id} を初期化しますか？\n対戦中でも全データが消えます。`))return;await fetch("/api/reset",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({room:id})});await loadRooms()}
function joinRoom(id){const name=$("#nameInput").value.trim()||"プレイヤー";localStorage.setItem("nimtoName",name);roomId=id;manualClose=false;$("#titleScreen").classList.add("hidden");$("#appScreen").classList.remove("hidden");connect(name)}
function connect(name){if(ws)try{ws.close()}catch(_){}const proto=location.protocol==="https:"?"wss":"ws";const url=`${proto}://${location.host}/ws/${roomId}?cid=${encodeURIComponent(clientId)}&name=${encodeURIComponent(name)}`;let opened=false;ws=new WebSocket(url);$("#conn").textContent="接続中";$("#conn").classList.remove("ok");ws.onopen=()=>{opened=true;$("#conn").textContent="接続済み";$("#conn").classList.add("ok");clearInterval(pingTimer);pingTimer=setInterval(()=>{if(ws?.readyState===1)ws.send("ping")},25000)};ws.onmessage=e=>{if(e.data==="pong")return;let m;try{m=JSON.parse(e.data)}catch(_){return}if(m.type==="state"){state=m.state;selected=null;render()}else if(m.type==="error")toast(m.message);else if(m.type==="roomReset"){toast(m.message||"部屋が初期化されました");manualClose=true;setTimeout(backTitle,500)}};ws.onclose=()=>{clearInterval(pingTimer);$("#conn").textContent="切断";$("#conn").classList.remove("ok");if(manualClose||!roomId)return;if(!opened){toast("この部屋には現在入れません");manualClose=true;setTimeout(backTitle,700);return}setTimeout(()=>connect(localStorage.getItem("nimtoName")||"プレイヤー"),1500)};ws.onerror=()=>{}}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
function backTitle(){manualClose=true;roomId=null;state=null;selected=null;clearInterval(pingTimer);if(ws)try{ws.close()}catch(_){}ws=null;$("#appScreen").classList.add("hidden");$("#titleScreen").classList.remove("hidden");$("#resultModal").classList.remove("show");loadRooms()}
function render(){if(!state)return;const me=state.players.find(p=>p.id===state.selfId);const host=state.selfId===state.hostId;$("#roomLabel").textContent=`ROOM ${roomId}`;$("#modeLabel").textContent=state.settings.mode==="decrease"?`減点式 ${state.settings.startPoints}点開始`:`加点式 ${state.settings.goalPoints}点ゴール`;$("#resetBtn").style.visibility=host?"visible":"hidden";renderPlayers();if(state.phase==="lobby")renderLobby(host);else renderGame(host,me);renderResult(host)}
function renderPlayers(){$("#players").innerHTML=state.players.map(p=>`<div class="player ${p.id===state.selfId?"me":""} ${p.id===state.hostId?"host":""} ${p.connected?"":"offline"}"><div class="pname">${esc(p.name)}</div><div class="pmeta"><span>${p.connected?"接続中":"切断"}</span><span class="pscore">${p.score}</span></div></div>`).join("")}
function renderLobby(host){$("#lobbyMain").classList.remove("hidden");$("#gameArea").classList.add("hidden");$("#lower").classList.add("hidden");$("#lobbyPlayers").innerHTML=state.players.map(p=>`<div class="lobby-player"><span>${esc(p.name)}${p.id===state.hostId?" ★":""}</span><span class="muted">${p.connected?"接続中":"切断"}</span></div>`).join("");const dec=state.settings.mode==="decrease";$("#modeDecrease").classList.toggle("active",dec);$("#modeIncrease").classList.toggle("active",!dec);$("#startPointsRow").classList.toggle("hidden",!dec);$("#goalPointsRow").classList.toggle("hidden",dec);$("#startPoints").value=state.settings.startPoints;$("#goalPoints").value=state.settings.goalPoints;$("#ruleText").textContent=dec?"カードを引き取るたび牛マーク分だけ持ち点を減らし、0点以下になった時点で終了。残り点が高い順に順位決定。":"6枚目を置いて列を取った場合は牛マーク分を加点。全列より小さいカードで列を取った場合は牛マーク分を減点。ゴール点以上で勝利。";document.querySelectorAll("#modeDecrease,#modeIncrease,#startPoints,#goalPoints,#startBtn").forEach(e=>e.style.pointerEvents=host?"auto":"none");document.querySelectorAll("#startPoints,#goalPoints").forEach(e=>e.disabled=!host);$("#startBtn").disabled=!host||state.players.length<2}
function renderGame(host,me){$("#lobbyMain").classList.add("hidden");$("#gameArea").classList.remove("hidden");$("#lower").classList.remove("hidden");$("#turnLabel").textContent=`ラウンド${state.round} / ${state.turn}ターン`;renderRows();renderReveal();renderHand(me);renderLog()}
function renderRows(){const choice=state.waitingChoice?.playerId===state.selfId;$("#rows").innerHTML=state.rows.map((row,i)=>{const filled=row.map(n=>cardHTML(n));const empty=Array.from({length:Math.max(0,5-row.length)},()=>`<div class="slot"></div>`);return `<div class="row ${choice?"choice":""}" data-row="${i}"><div class="row-num">${i+1}</div><div class="cards">${filled.concat(empty).join("")}</div><div class="row-meta"><b>${row.length}/5枚</b>${bullSum(row)}点</div></div>`}).join("");if(choice){document.querySelectorAll(".row.choice").forEach(r=>r.onclick=()=>send({type:"chooseRow",row:Number(r.dataset.row)}))}}
function renderReveal(){const waiting=state.waitingChoice;if(waiting){$("#waitLabel").textContent=waiting.playerId===state.selfId?"引き取る列を選択":"列選択待ち"}else $("#waitLabel").textContent="";if(state.lastReveal?.length){$("#revealGrid").innerHTML=state.lastReveal.map(x=>`<div class="reveal-item">${cardHTML(x.card)}<div class="rname">${esc(x.name)}</div></div>`).join("")}else{$("#revealGrid").innerHTML=`<div class="submitted-wait">${state.players.map(p=>`<div class="submitted-line ${state.submittedIds.includes(p.id)?"done":""}"><span>${esc(p.name)}</span><span>${state.submittedIds.includes(p.id)?"確定済み":"選択中"}</span></div>`).join("")}</div>`}}
function renderHand(me){const locked=state.mySubmitted||!!state.waitingChoice||state.phase!=="playing";$("#handStatus").textContent=state.mySubmitted?"提出済み・全員待ち":state.waitingChoice?.playerId===state.selfId?"列を選択してください":"1枚選択";$("#hand").innerHTML=(state.myHand||[]).map(n=>cardHTML(n,`hand-card ${selected===n?"selected":""} ${locked?"locked":""}`)).join("");document.querySelectorAll(".hand-card").forEach(c=>c.onclick=()=>{if(locked)return;selected=Number(c.dataset.card);renderHand(me)});$("#selectedText").textContent=selected?`${selected} を選択中`:"カード未選択";$("#playBtn").disabled=!selected||locked}
function renderLog(){$("#log").innerHTML=(state.logs||[]).slice(-12).map(x=>`<div class="log-line ${esc(x.type)}">${esc(x.text)}</div>`).join("")}
function renderResult(host){const modal=$("#resultModal");if(state.phase!=="roundEnd"&&state.phase!=="finished"){modal.classList.remove("show");return}const finished=state.phase==="finished";const list=finished?state.ranking:state.roundSummary;$("#resultTitle").textContent=finished?"ゲーム終了":`ラウンド${state.round}終了`;$("#resultBody").innerHTML=`<table class="rank"><thead><tr><th>順位</th><th>プレイヤー</th><th>得点</th></tr></thead><tbody>${(list||[]).map(x=>`<tr><td>${x.rank}</td><td>${esc(x.name)}</td><td>${x.score}</td></tr>`).join("")}</tbody></table>${host?"":`<p class="muted">ホストの操作を待っています。</p>`}`;const a=$("#resultAction");a.textContent=finished?"ロビーへ戻る":"次のラウンド";a.disabled=!host;a.onclick=()=>send({type:finished?"backLobby":"nextRound"});modal.classList.add("show")}

$("#refreshRooms").onclick=loadRooms;$("#leaveBtn").onclick=()=>{if(!state)return;if(state.phase==="playing"||state.phase==="roundEnd"){toast("対戦中は席を維持します。ブラウザを閉じても再接続できます。");return}send({type:"leave"});manualClose=true;setTimeout(backTitle,200)};$("#resetBtn").onclick=()=>{if(confirm("この部屋を初期化しますか？\n対戦中のデータも消えます。"))resetRoom(roomId)};$("#modeDecrease").onclick=()=>updateSettings("decrease");$("#modeIncrease").onclick=()=>updateSettings("increase");$("#startPoints").onchange=()=>updateSettings(state.settings.mode);$("#goalPoints").onchange=()=>updateSettings(state.settings.mode);function updateSettings(mode){send({type:"settings",mode,startPoints:Number($("#startPoints").value)||66,goalPoints:Number($("#goalPoints").value)||66})}$("#startBtn").onclick=()=>send({type:"start"});$("#playBtn").onclick=()=>{if(selected)send({type:"play",card:selected})};
const savedName=localStorage.getItem("nimtoName");if(savedName)$("#nameInput").value=savedName;loadRooms();setInterval(()=>{if(!roomId)loadRooms()},10000);
</script>
</body>
</html>
